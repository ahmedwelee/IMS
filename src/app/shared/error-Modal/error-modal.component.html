<div class="modal fade" [class.show]="showModal" [style.display]="showModal ? 'block' : 'none'"
     *ngIf="showModal" tabindex="-1" role="dialog" aria-modal="true">
  <div class="modal-dialog modal-dialog-centered" role="document" *ngIf="error">
    <div class="modal-content border-0 shadow-lg">
      <!-- Header -->
      <div class="modal-header bg-danger text-white">
        <h5 class="modal-title">
          <i class="fas fa-exclamation-triangle me-2"></i>
          {{ error.title || 'Error' }}
          <span *ngIf="error.statusCode" class="badge bg-light text-dark ms-2">
            {{ error.statusCode }}
          </span>
        </h5>
        <button type="button" class="btn-close btn-close-white" (click)="closeModal()" aria-label="Close"></button>
      </div>

      <!-- Body -->
      <div class="modal-body">
        <div class="alert alert-danger border-0 mb-0">
          <div class="d-flex">
            <div class="flex-shrink-0">
              <i class="fas fa-bug fa-2x"></i>
            </div>
            <div class="flex-grow-1 ms-3">
              <h6 class="alert-heading">Something went wrong!</h6>
              <p class="mb-2">{{ error.message || 'An unexpected error occurred.' }}</p>

              <div *ngIf="error.timestamp" class="mt-3">
                <small class="text-muted">
                  <i class="fas fa-clock me-1"></i>
                  {{ error.timestamp | date:'medium' }}
                </small>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Footer -->
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="closeModal()">
          <i class="fas fa-times me-1"></i> Close
        </button>
        <button *ngIf="error.statusCode === 401 || error.statusCode === 403"
                type="button" class="btn btn-primary" (click)="closeModal()">
          <i class="fas fa-sign-in-alt me-1"></i> Login
        </button>
        <button *ngIf="error.statusCode === 500"
                type="button" class="btn btn-warning" (click)="closeModal()">
          <i class="fas fa-redo me-1"></i> Retry
        </button>
      </div>
    </div>
  </div>
</div>

<div class="modal-backdrop fade show" [class.d-block]="showModal" *ngIf="showModal"></div>
