<div class="container-fluid">
  <!-- Dashboard Header -->
  <div class="row mb-4">
    <div class="col-12">
      <div class="d-flex justify-content-between align-items-center">
        <div>
          <h2 class="mb-1">Dashboard Overview</h2>
          <p class="text-muted mb-0">Monitor your system's key metrics</p>
        </div>
        <button class="btn btn-outline-primary" (click)="refreshStats()">
          <i class="fas fa-sync-alt me-2"></i>Refresh Stats
        </button>
      </div>
    </div>
  </div>

  <!-- Statistics Cards -->
  <div class="row">
    <div class="col-md-6 col-lg-3 mb-4" *ngFor='let topcard of topcards'>
      <div class="card stat-card h-100">
        <div class="card-body">
          <div class="d-flex align-items-center">
            <div class="btn btn-lg rounded-circle d-flex align-items-center justify-content-center bg-light-{{topcard.bgcolor}} text-{{topcard.bgcolor}}"
                 style="width: 60px; height: 60px;">
              <i class="{{topcard.icon}} fs-4"></i>
            </div>
            <div class="ms-3 flex-grow-1">
              <div class="d-flex align-items-center">
                <h3 class="mb-0 font-weight-bold me-2" *ngIf="!topcard.loading">
                  {{topcard.title | number}}
                </h3>
                <div class="spinner-border loading-spinner text-{{topcard.bgcolor}}"
                     role="status" *ngIf="topcard.loading">
                  <span class="visually-hidden">Loading...</span>
                </div>
              </div>
              <small class="text-muted fs-6">{{topcard.subtitle}}</small>
            </div>
          </div>
        </div>

        <!-- Optional: Add a subtle progress indicator or trend -->
        <div class="card-footer bg-transparent border-0 py-2">
          <small class="text-muted">
            <i class="fas fa-chart-line me-1"></i>
            Updated just now
          </small>
        </div>
      </div>
    </div>
  </div>
</div>
