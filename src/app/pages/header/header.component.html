<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
  <div class="container">
    <a class="navbar-brand" href="home">
      <img
        src="assets/images/logos/medlogo-removebg-preview.png"
        style="width:100px; height: 50px;"
      />
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link " routerLink="/home" >Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" (click)="toJobs()">Jobs</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="about">About</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="contact">Contact</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" routerLink="/history">History</a>
        </li>
      </ul>
      <div class="navbar-nav">
        <div *ngIf="!isLoggedIn" class="d-flex">
          <button class="btn btn-outline-light me-2" (click)="login()">
            <i class="bi bi-sign-in-alt me-1"></i>Login
          </button>
          <button class="btn btn-primary" (click)="register()">
            <i class="bi bi-user-plus me-1"></i>Register
          </button>
        </div>
        <div *ngIf="isLoggedIn" class="dropdown">
          <a class="nav-link dropdown-toggle d-flex align-items-center"
             id="profileDropdown"
             role="button"
             data-bs-toggle="dropdown"
             (click)="toggleProfileDropdown()">
            <div class="rounded-circle bg-primary d-flex align-items-center justify-content-center me-2"
                 style="width: 32px; height: 32px;">
              <span class="text-white fw-bold" style="font-size: 0.8rem;">
                {{ getUserInitials() }}
              </span>
            </div>
            {{ getDisplayName() }}
          </a>

          <ul class="dropdown-menu dropdown-menu-end"
              [class.show]="isProfileDropdownOpen">
            <li class="dropdown-header">
              <strong>{{ getDisplayName() }}</strong>
              <br>
              <small class="text-muted">{{ userProfile?.email }}</small>
            </li>
            <li><hr class="dropdown-divider"></li>

            <li>
              <a class="dropdown-item" (click)="openProfile(); $event.preventDefault()">
                <i class="bi bi-user me-2"></i>View Profile
              </a>
            </li>

            <li>
              <a class="dropdown-item" href="dashboard" (click)="navigateToDashboard()" *ngIf="isDirector() || isManager()">
                <i class="fas fa-tachometer-alt me-2"></i>Dashboard
              </a>
            </li>

            <li *ngIf="canAccessClients()">
              <a class="dropdown-item" href="#" (click)="toClients()">
                <i class="bi bi-users me-2"></i>Manage Clients
              </a>
            </li>

            <li><hr class="dropdown-divider"></li>

            <li>
              <a class="dropdown-item text-danger"
                 (click)="logout(); $event.preventDefault()">
                <i class="bi bi-sign-out-alt me-2"></i>Logout
              </a>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</nav>
<div class="modal fade" [class.show]="showProfile" [style.display]="showProfile ? 'block' : 'none'" *ngIf="showProfile">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">
          <i class="bi bi-user me-2"></i>User Profile
        </h5>
        <button type="button" class="btn-close" (click)="showProfile = false"></button>
      </div>
      <div class="modal-body">
        <form #profileForm="ngForm">
          <div class="text-center mb-4">
            <div class="profile-avatar rounded-circle d-flex align-items-center justify-content-center mx-auto">
              <span class="fs-2 text-white">{{ userProfile.name?.charAt(0) || 'U' }}</span>
            </div>
          </div>
          <div class="row">
            <div class="col-md-6 mb-3">
              <label class="form-label">Full Name</label>
              <input type="text" class="form-control" [(ngModel)]="userProfile.name" name="name">
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Email</label>
              <input type="email" class="form-control" [(ngModel)]="userProfile.email" name="email">
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Phone</label>
              <input type="tel" class="form-control" [(ngModel)]="userProfile.phone" name="phone">
            </div>
            <div class="col-md-6 mb-3">
              <label class="form-label">Role</label>
              <select class="form-select" [(ngModel)]="userProfile.role" name="role">
                <option value="Job Seeker">Job Seeker</option>
                <option value="Employer">Employer</option>
                <option value="HR Manager">HR Manager</option>
              </select>
            </div>
            <div class="col-12 mb-3">
              <label class="form-label">Bio</label>
              <textarea class="form-control" rows="3" [(ngModel)]="userProfile.bio" name="bio"></textarea>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" (click)="showProfile = false">Cancel</button>
        <button type="button" class="btn btn-primary" (click)="updateProfile()">Save Changes</button>
      </div>
    </div>
  </div>
</div>
