<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
  <div class="container">
    <a class="navbar-brand" href="#">
      <i class="bi bi-briefcase me-2"></i>
      JobPortal
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item">
          <a class="nav-link active" href="#home">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" (click)="toJobs()">Jobs</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#about">About</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="#contact">Contact</a>
        </li>
      </ul>
      <div class="navbar-nav">
        <div *ngIf="!isLoggedIn" class="d-flex">
          <button class="btn btn-outline-light me-2" (click)="login()">
            <i class="bi bi-sign-in-alt me-1"></i>Login
          </button>
          <button class="btn btn-primary" (click)="register()">
            <i class="bi bi-user-plus me-1"></i>Register
          </button>
        </div>
        <div *ngIf="isLoggedIn" class="dropdown">
          <a class="nav-link dropdown-toggle d-flex align-items-center"
             id="profileDropdown"
             role="button"
             data-bs-toggle="dropdown"
             (click)="toggleProfileDropdown()">
            <div class="rounded-circle bg-primary d-flex align-items-center justify-content-center me-2"
                 style="width: 32px; height: 32px;">
              <span class="text-white fw-bold" style="font-size: 0.8rem;">
                {{ getUserInitials() }}
              </span>
            </div>
            {{ getDisplayName() }}
          </a>

          <ul class="dropdown-menu dropdown-menu-end"
              [class.show]="isProfileDropdownOpen">
            <li class="dropdown-header">
              <strong>{{ getDisplayName() }}</strong>
              <br>
              <small class="text-muted">{{ userProfile?.email }}</small>
            </li>
            <li><hr class="dropdown-divider"></li>

            <li>
              <a class="dropdown-item" href="#" (click)="openProfile(); $event.preventDefault()">
                <i class="bi bi-user me-2"></i>View Profile
              </a>
            </li>

            <li>
              <a class="dropdown-item" href="#" (click)="navigateToDashboard()">
                <i class="fas fa-tachometer-alt me-2"></i>Dashboard
              </a>
            </li>

            <li *ngIf="canAccessClients()">
              <a class="dropdown-item" href="#" (click)="toClients()">
                <i class="bi bi-users me-2"></i>Manage Clients
              </a>
            </li>

            <li><hr class="dropdown-divider"></li>

            <li>
              <a class="dropdown-item text-danger"
                 (click)="logout(); $event.preventDefault()">
                <i class="bi bi-sign-out-alt me-2"></i>Logout
              </a>
            </li>
          </ul>
        </div>
      </div>
    </div>
  </div>
</nav>
